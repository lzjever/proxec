[package]
name = "proxec"
version = "0.1.1"
edition = "2021"
authors = ["proxec contributors"]
license = "MIT"
description = "Dead-simple Linux-native transparent proxy runner for apps that do not support proxy settings"
readme = "README.md"
repository = "https://github.com/lzjever/proxec"
keywords = ["proxy", "transparent", "linux", "socks5", "ptrace"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
# CLI - minimal, POSIX-compliant
clap = { version = "4", features = ["derive", "std"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }

# System calls
nix = { version = "0.27", features = ["ptrace", "process", "signal", "uio"] }
libc = "0.2"

# Error handling
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# URL parsing (for proxy environment variables)
url = "2"

# Base64 for HTTP proxy auth
base64 = "0.21"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
